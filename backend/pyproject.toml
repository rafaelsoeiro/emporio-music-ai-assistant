[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "emporio-music-backend"
version = "0.1.0"
description = "Backend da aplicação Emporio Music"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "alembic>=1.14,<2.0",
    "fastapi>=0.115,<1.0",
    "langchain-community>=0.3",
    "langchain-openai>=0.3",
    "langchain-qdrant>=0.2",
    "langchain-text-splitters>=0.3",
    "pydantic-settings>=2.6,<3.0",
    "pypdf>=5.0",
    "qdrant-client>=1.12,<2.0",
    "sqlalchemy>=2.0,<3.0",
    "uvicorn[standard]>=0.32,<1.0",
]

[project.optional-dependencies]
dev = [
    "httpx>=0.27,<1.0",
    "pytest>=8.3,<9.0",
    "ruff>=0.8,<1.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]
namespaces = false

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
target-version = "py310"
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

